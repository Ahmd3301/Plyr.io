name: Build VideoPlyr APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Create Assets Directory
        run: mkdir -p app/src/main/assets

      - name: Download Plyr Assets
        run: |
          curl -L "https://cdn.plyr.io/3.4.6/plyr.min.js" -o app/src/main/assets/plyr.min.js
          curl -L "https://cdn.plyr.io/3.4.6/plyr.css" -o app/src/main/assets/plyr.min.css

      # ملاحظة: تم استبدال ./gradlew بـ gradle العادي المثبت في الويندوز/لينكس للتبسيط
      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlyr-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: "VideoPlyr Build #${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
